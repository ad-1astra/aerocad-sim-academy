<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/academy.css">
<style>
  /* block colours follow TinkerCAD Codeblocks: Shapes blue, Modify purple, Control orange */
  :root { --b-shape: #3f9cf0; --b-modify: #a57cf0; --b-control: #ffb547; --b-drone: #2fc7a6; }
  .editor { position: absolute; z-index: 16; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 380px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 10px; }
  .editor h2 { font-size: 0.72rem; font-family: var(--f-hud); color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 400; }
  .palette { display: flex; flex-wrap: wrap; gap: 5px; }
  .palette button { border: 0; border-radius: 6px; padding: 6px 9px; font-size: 0.8rem; font-weight: 700; cursor: pointer; color: #08121c; }
  .prog { overflow: auto; background: var(--raised); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .prog .start { font-family: var(--f-hud); font-size: 0.72rem; color: var(--green); }
  .blk { display: flex; align-items: center; gap: 6px; border-radius: 6px; padding: 5px 6px 5px 8px; color: #08121c; font-weight: 700; font-size: 0.82rem; flex-wrap: wrap; }
  .blk input { width: 46px; border: 0; border-radius: 4px; padding: 3px 4px; font: 0.82rem var(--f-hud); text-align: center; background: rgba(255,255,255,0.85); color: #08121c; }
  .blk .ctl { margin-left: auto; display: flex; gap: 2px; }
  .blk .ctl button { width: 24px; height: 24px; border: 0; border-radius: 4px; background: rgba(0,0,0,0.18); color: #08121c; cursor: pointer; font-weight: 700; }
  .blk.run { outline: 3px solid #ffffff; outline-offset: 1px; }
  .rep { border-radius: 8px; background: color-mix(in srgb, var(--b-control) 25%, transparent); display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; }
  .rep > .blk { border-bottom-left-radius: 0; }
  .rep .body { margin-left: 14px; min-height: 30px; border-radius: 6px; border: 2px dashed transparent; display: flex; flex-direction: column; gap: 4px; padding: 3px; cursor: pointer; }
  .rep .body.target { border-color: var(--b-control); }
  .rep .body:empty::after { content: 'Click here, then add blocks inside the loop'; font-size: 0.72rem; color: var(--dim); padding: 4px; }
  .prog.target-main { box-shadow: inset 0 0 0 2px var(--green); }
  .runbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .runbar .ac-btn { flex: 1; }
  .count { font-family: var(--f-hud); font-size: 0.72rem; color: var(--dim); }
  @media (max-width: 980px) { .editor { top: auto; height: 52%; width: calc(100% - 24px); } }
</style>
</head>
<body>
<main class="game"><div id="stage"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/questions.js"></script>
<script src="js/code.js"></script>
</body>
</html>

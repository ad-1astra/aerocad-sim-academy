<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/academy.css">
<style>
  .bal { display: grid; grid-template-columns: 22px 1fr 58px; gap: 3px 6px; align-items: center; font-family: var(--f-hud); font-size: 0.72rem; margin: 2px 0 4px; }
  .bal .bar { height: 9px; border-radius: 3px; background: var(--raised); overflow: hidden; }
  .bal .bar i { display: block; height: 100%; width: 0; }
  .bal .n { text-align: right; font-variant-numeric: tabular-nums; }
  .eq { font-family: var(--f-hud); font-size: 0.72rem; text-align: center; padding: 2px 0 4px; }
  .stallwarn {
    position: absolute; z-index: 17; left: 50%; top: 150px; transform: translateX(-50%);
    font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; color: var(--red); letter-spacing: 0.2em;
    padding: 4px 18px; border: 2px solid var(--red); border-radius: 8px; background: rgba(40, 6, 6, 0.6);
    animation: blink 0.5s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  @media (max-width: 980px) { .stallwarn { top: 215px; font-size: 1.2rem; } }
</style>
</head>
<body>
<main class="game"><div id="stage"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/questions.js"></script>
<script src="js/sky.js"></script>
</body>
</html>

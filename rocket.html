<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launch Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/academy.css">
<style>
  .builder { position: absolute; z-index: 16; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); width: 330px; max-height: calc(100% - 90px); overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .builder h2 { font-size: 1.2rem; }
  .builder .grp > div:first-child { font-family: var(--f-hud); font-size: 0.68rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .builder .ac-seg button { line-height: 1.2; padding: 5px 4px; }
  .builder .ac-seg button small { display: block; color: var(--dim); font-size: 0.66rem; }
  .calc { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-family: var(--f-hud); font-size: 0.74rem; background: var(--raised); border-radius: 8px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
  .calc span:nth-child(odd) { color: var(--dim); }
  .calc .hl { color: var(--cyan); }
  .checks { display: flex; flex-direction: column; gap: 2px; font-size: 0.84rem; }
  .checks .ok { color: var(--green); } .checks .no { color: var(--red); } .checks .mid { color: var(--amber); }
  body.flying .ac-missions { display: none; }
  .countdown { position: absolute; z-index: 30; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--f-display); font-weight: 700; font-size: 5rem; color: var(--fg); text-shadow: 0 4px 30px rgba(0,0,0,0.6); pointer-events: none; }
  @media (max-width: 980px) { .builder { top: auto; bottom: 10px; width: calc(100% - 24px); max-height: 55%; } }
</style>
</head>
<body>
<main class="game"><div id="stage"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/questions.js"></script>
<script src="js/rocket.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stability Hangar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/academy.css">
<style>
  .mtab { width: 100%; border-collapse: collapse; font-family: var(--f-hud); font-size: 0.72rem; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .mtab th { color: var(--dim); font-weight: 400; text-align: right; padding: 2px 3px; border-bottom: 1px solid var(--line); }
  .mtab th:first-child, .mtab td:first-child { text-align: left; }
  .mtab td { text-align: right; padding: 3px; }
  .mtab tr.tot td { border-top: 1px solid var(--line); color: var(--cyan); }
  .choices {
    position: absolute; z-index: 16; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(620px, calc(100% - 24px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .choices .q { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; text-align: center; }
  .choices .q small { display: block; font-family: var(--f-hud); font-weight: 400; font-size: 0.68rem; letter-spacing: 0.12em; color: var(--magenta); text-transform: uppercase; }
  .choices .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .choices .opts.two { grid-template-columns: repeat(2, 1fr); }
  .choices .opts button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; font-size: 0.86rem; padding: 6px 8px; line-height: 1.25; }
  .choices .opts button:hover { border-color: var(--cyan); }
  .choices .opts button.right { border-color: var(--green); background: rgba(75, 227, 138, 0.15); }
  .choices .opts button.wrong { border-color: var(--red); background: rgba(255, 90, 79, 0.15); }
  @media (max-width: 560px) { .choices .opts { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main class="game"><div id="stage"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/questions.js"></script>
<script src="js/stability.js"></script>
</body>
</html>

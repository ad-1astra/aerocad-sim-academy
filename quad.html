<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quad Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono&family=Chakra+Petch:wght@500;700&display=swap">
<link rel="stylesheet" href="css/academy.css">
<style>
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0; }
  .mcell { position: relative; background: var(--raised); border-radius: 6px; padding: 5px 7px; overflow: hidden; font-family: var(--f-hud); font-size: 0.7rem; min-height: 46px; }
  .mcell i { position: absolute; left: 0; bottom: 0; right: 0; height: 0; opacity: 0.28; }
  .mcell b { position: relative; display: block; font-size: 0.78rem; }
  .mcell span { position: relative; color: var(--dim); }
  .mcell em { position: relative; font-style: normal; float: right; color: var(--fg); }
  .lab {
    position: absolute; z-index: 16; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(440px, calc(100% - 24px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .lab .task { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
  .lab .task small { display: block; font-family: var(--f-hud); font-weight: 400; font-size: 0.68rem; color: var(--magenta); letter-spacing: 0.12em; text-transform: uppercase; }
  .lab .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lab .pick button { border-radius: 8px; border: 1px solid var(--line); background: var(--raised); padding: 8px; cursor: pointer; text-align: left; font-size: 0.82rem; line-height: 1.3; }
  .lab .pick button b { font-family: var(--f-hud); }
  .lab .pick button.hi { border-color: var(--green); background: rgba(75, 227, 138, 0.14); }
  .lab .pick button .st { float: right; font-family: var(--f-hud); font-size: 0.72rem; }
  .lab .front { text-align: center; font-family: var(--f-hud); font-size: 0.66rem; color: var(--red); letter-spacing: 0.14em; }
  .designer { position: absolute; z-index: 16; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 150px); overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .designer h2 { font-size: 1.3rem; }
  .designer .grp > div:first-child { font-family: var(--f-hud); font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
  .designer .ac-seg button { text-align: left; line-height: 1.25; padding: 6px 8px; }
  .designer .ac-seg button small { display: block; color: var(--dim); font-size: 0.7rem; }
  .checks { display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; }
  .checks .ok { color: var(--green); } .checks .no { color: var(--red); }
  .calc { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-family: var(--f-hud); font-size: 0.78rem; background: var(--raised); border-radius: 8px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
  .calc span:nth-child(odd) { color: var(--dim); }
  @media (max-width: 980px) { .designer { top: auto; bottom: 10px; transform: translateX(-50%); max-height: 62%; } }
</style>
</head>
<body>
<main class="game"><div id="stage"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="lib/three.min.js"><\/script>')</script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/questions.js"></script>
<script src="js/quad.js"></script>
</body>
</html>
